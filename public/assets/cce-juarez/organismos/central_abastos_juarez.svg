<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="100%" height="100%">
  <defs>
    <linearGradient id="caGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA8010" />
    </linearGradient>
  </defs>
  <!-- Archway structure inspired by the Central de Abastos Cd. Juárez entrance arch -->
  <path d="M12 34 C40 10, 80 10, 108 34" fill="none" stroke="url(#caGold)" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M20 42 C44 22, 76 22, 100 42" fill="none" stroke="#10B981" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Left & Right Pillars -->
  <rect x="16" y="34" width="7" height="48" rx="2" fill="url(#caGold)"/>
  <rect x="97" y="34" width="7" height="48" rx="2" fill="url(#caGold)"/>
  <!-- Bold CA Monogram in pure white -->
  <text x="60" y="73" text-anchor="middle" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="38" fill="#FFFFFF" letter-spacing="1">CA</text>
  <!-- Base line -->
  <rect x="10" y="84" width="100" height="5" rx="2.5" fill="url(#caGold)"/>
</svg>