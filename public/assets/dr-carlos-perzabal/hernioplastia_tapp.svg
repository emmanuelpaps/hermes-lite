<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="bgHer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D18" />
      <stop offset="100%" stop-color="#0B1426" />
    </linearGradient>
  </defs>
  <rect width="400" height="320" rx="20" fill="url(#bgHer)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Abdominal Wall Muscle Layers -->
  <rect x="50" y="60" width="300" height="15" rx="4" fill="#991B1B" opacity="0.6" />
  <text x="50" y="50" fill="#F87171" font-size="9" font-family="sans-serif">Músculo Oblicuo y Transverso</text>
  
  <rect x="50" y="85" width="300" height="10" rx="3" fill="#B45309" opacity="0.5" />
  <text x="50" y="110" fill="#FBBF24" font-size="9" font-family="sans-serif">Fascia Transversalis</text>

  <!-- Hernia Defect -->
  <path d="M160 85 Q200 130 240 85" fill="none" stroke="#EF4444" stroke-width="3" />
  <text x="200" y="120" fill="#FCA5A5" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">Defecto Herniario</text>

  <!-- 3D Preperitoneal Lightweight Mesh (Malla TAPP/TEP) -->
  <rect x="120" y="145" width="160" height="70" rx="8" fill="rgba(0, 163, 224, 0.15)" stroke="#00A3E0" stroke-width="2" />
  <!-- Mesh Grid Lines -->
  <path d="M130 145 L130 215 M150 145 L150 215 M170 145 L170 215 M190 145 L190 215 M210 145 L210 215 M230 145 L230 215 M250 145 L250 215 M270 145 L270 215" stroke="#38BDF8" stroke-width="0.7" opacity="0.5" />
  <path d="M120 160 L280 160 M120 175 L280 175 M120 190 L280 190 M120 205 L280 205" stroke="#38BDF8" stroke-width="0.7" opacity="0.5" />

  <text x="200" y="175" fill="#38BDF8" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">Malla 3D Preperitoneal</text>
  <text x="200" y="190" fill="#FEF3C7" font-size="9" font-family="sans-serif" text-anchor="middle">Cobertura Orificio de Fruchaud</text>

  <!-- Deep Peritoneum Layer -->
  <path d="M40 235 Q200 245 360 235" stroke="#64748B" stroke-width="2" stroke-dasharray="4 4" />
  <text x="200" y="255" fill="#94A3B8" font-size="9" font-family="sans-serif" text-anchor="middle">Peritoneo Parietal Reperitonealizado</text>

  <!-- Technical Summary Card -->
  <rect x="25" y="265" width="350" height="42" rx="8" fill="#0B1426" stroke="#334155" stroke-width="1" />
  <text x="40" y="282" fill="#10B981" font-size="10" font-family="sans-serif" font-weight="bold">✓ Cero Tensión Tisular · Recidiva &lt; 1.5%</text>
  <text x="40" y="296" fill="#94A3B8" font-size="9" font-family="sans-serif">Mínimo dolor posoperatorio · Sin fijación traumática a ramas nerviosas</text>
</svg>