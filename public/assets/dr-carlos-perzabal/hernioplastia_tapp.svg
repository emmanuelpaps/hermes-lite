<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="bgHerVol" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B14" />
      <stop offset="50%" stop-color="#0A1224" />
      <stop offset="100%" stop-color="#080F1E" />
    </linearGradient>
    <linearGradient id="meshVolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00A3E0" stop-opacity="0.35" />
    </linearGradient>
    <radialGradient id="meshCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#0284C7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0C4A6E" stop-opacity="0.05" />
    </radialGradient>
    <filter id="glowHerVol" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="320" rx="16" fill="url(#bgHerVol)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Subtle Surgical Grid Overlay -->
  <g opacity="0.07" stroke="#38BDF8" stroke-width="0.5">
    <line x1="40" y1="0" x2="40" y2="320" />
    <line x1="120" y1="0" x2="120" y2="320" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="280" y1="0" x2="280" y2="320" />
    <line x1="360" y1="0" x2="360" y2="320" />
    <line x1="0" y1="60" x2="400" y2="60" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="180" x2="400" y2="180" />
    <line x1="0" y1="240" x2="400" y2="240" />
  </g>

  <!-- Abdominal Wall Muscle Layers (Repaired Alignment) -->
  <rect x="50" y="58" width="300" height="16" rx="4" fill="#991B1B" opacity="0.75" stroke="#F87171" stroke-width="1" />
  <text x="52" y="50" fill="#F87171" font-size="8.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="600">Músculo Oblicuo y Transverso (Pared Reparada)</text>
  
  <rect x="50" y="82" width="300" height="12" rx="3" fill="#B45309" opacity="0.65" stroke="#FBBF24" stroke-width="1" />
  <text x="52" y="106" fill="#FBBF24" font-size="8.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="600">Fascia Transversalis</text>

  <!-- Ghost of Original Reduced Hernia Defect -->
  <path d="M165 94 Q200 120 235 94" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="3 3" opacity="0.6" />
  <text x="200" y="116" fill="#FCA5A5" font-size="8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="bold" text-anchor="middle">Defecto Herniario Reducido</text>

  <!-- 3D Preperitoneal Macroporous Mesh (10 x 15 cm Malla Anatómica Tridimensional) -->
  <!-- Outer Contour with Rounded Ergonomic Corners -->
  <rect x="110" y="132" width="180" height="88" rx="12" fill="url(#meshCenterGlow)" stroke="#00A3E0" stroke-width="2.5" filter="url(#glowHerVol)" />
  
  <!-- Volumetric Macroporous Orthogonal & Hexagonal Weave -->
  <g stroke="#38BDF8" stroke-width="0.8" opacity="0.55">
    <line x1="125" y1="132" x2="125" y2="220" />
    <line x1="145" y1="132" x2="145" y2="220" />
    <line x1="165" y1="132" x2="165" y2="220" />
    <line x1="185" y1="132" x2="185" y2="220" />
    <line x1="205" y1="132" x2="205" y2="220" />
    <line x1="225" y1="132" x2="225" y2="220" />
    <line x1="245" y1="132" x2="245" y2="220" />
    <line x1="265" y1="132" x2="265" y2="220" />
    <line x1="110" y1="148" x2="290" y2="148" />
    <line x1="110" y1="164" x2="290" y2="164" />
    <line x1="110" y1="180" x2="290" y2="180" />
    <line x1="110" y1="196" x2="290" y2="196" />
    <line x1="110" y1="210" x2="290" y2="210" />
    <!-- Diagonal 3D Curvature Lines -->
    <path d="M110 132 Q200 148 290 132 M110 220 Q200 236 290 220" stroke="#00E5FF" stroke-width="1.2" opacity="0.75" />
  </g>

  <!-- Central Mesh Typography -->
  <text x="200" y="166" fill="#38BDF8" font-size="11" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="bold" text-anchor="middle">Malla 3D Preperitoneal</text>
  <text x="200" y="180" fill="#FEF3C7" font-size="9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="600" text-anchor="middle">Cobertura Orificio de Fruchaud (10 x 15 cm)</text>
  <text x="200" y="194" fill="#6EE7B7" font-size="8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" text-anchor="middle">Fijación Atraumática · Sin Tensión</text>

  <!-- Nerves & Vessels Protection Callout (Triángulo del Dolor / de la Muerte protegidos) -->
  <circle cx="135" cy="205" r="3.5" fill="#10B981" />
  <circle cx="265" cy="205" r="3.5" fill="#10B981" />

  <!-- Fully Reperitonealized Deep Parietal Peritoneum Layer -->
  <path d="M35 238 Q200 252 365 238" stroke="#10B981" stroke-width="2.5" stroke-dasharray="4 3" filter="url(#glowHerVol)" />
  <text x="200" y="254" fill="#34D399" font-size="8.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="600" text-anchor="middle">Peritoneo Parietal Reperitonealizado (Cierre Hermético)</text>

  <!-- Top-Left Tactical Badge -->
  <g transform="translate(16, 16)">
    <rect width="144" height="66" rx="8" fill="#0B132B" fill-opacity="0.95" stroke="#00A3E0" stroke-width="1" />
    <circle cx="12" cy="14" r="3.5" fill="#00A3E0" />
    <text x="20" y="17" fill="#38BDF8" font-size="9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="800" letter-spacing="0.5">HERNIOPLASTÍA TAPP / TEP</text>
    <text x="12" y="32" fill="#F8FAFC" font-size="8.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="600">Malla 3D: 10 x 15 cm</text>
    <text x="12" y="45" fill="#10B981" font-size="8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">Cero Tensión · Sin Grapas</text>
    <text x="12" y="58" fill="#FDE68A" font-size="7.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">Recidiva &lt; 1.5% · EHS</text>
  </g>

  <!-- Technical Summary Card (Exact match to tests) -->
  <rect x="25" y="265" width="350" height="42" rx="8" fill="#0B1426" stroke="#334155" stroke-width="1" />
  <text x="40" y="282" fill="#10B981" font-size="10" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="bold">✓ Cero Tensión Tisular · Recidiva &lt; 1.5%</text>
  <text x="40" y="296" fill="#94A3B8" font-size="9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">Mínimo dolor posoperatorio · Sin fijación traumática a ramas nerviosas</text>
</svg>