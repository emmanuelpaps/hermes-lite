  <path d="M105 135 L105 85 C115 85 135 85 135 102 C135 118 115 118 105 118" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
  <!-- Robotic Dots -->
  <circle cx="100" cy="35" r="4" fill="#38BDF8" />
  <circle cx="100" cy="165" r="4" fill="#D4AF37" />
  <circle cx="60" cy="75" r="3" fill="#D4AF37" />
  <circle cx="140" cy="75" r="3" fill="#D4AF37" />
</svg>