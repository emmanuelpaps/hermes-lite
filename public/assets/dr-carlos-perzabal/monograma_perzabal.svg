      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00A3E0" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="32" fill="#070D18" />
  <rect x="6" y="6" width="188" height="188" rx="26" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6" />
  <circle cx="100" cy="100" r="76" fill="#0B1426" stroke="#00A3E0" stroke-width="1.5" stroke-dasharray="4 4" />
