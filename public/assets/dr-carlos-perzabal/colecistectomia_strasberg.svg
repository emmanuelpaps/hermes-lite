<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="bgCol" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D18" />
      <stop offset="100%" stop-color="#0B1426" />
    </linearGradient>
  </defs>
  <rect width="400" height="320" rx="20" fill="url(#bgCol)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Liver Inferior Border -->
  <path d="M40 70 Q200 40 360 80 L360 120 Q200 90 40 120 Z" fill="#78350F" fill-opacity="0.3" stroke="#92400E" stroke-width="1.5" />
  <text x="180" y="80" fill="#D97706" font-size="11" font-family="sans-serif" font-weight="bold">Lecho Hepático</text>

  <!-- Gallbladder (Vesícula Biliar) -->
  <path d="M220 100 C270 100 290 140 280 180 C270 210 240 210 230 180 C220 150 205 130 180 140" fill="#047857" fill-opacity="0.4" stroke="#10B981" stroke-width="2.5" />
  <text x="290" y="160" fill="#34D399" font-size="11" font-family="sans-serif" font-weight="bold">Vesícula Biliar</text>

  <!-- Strasberg CVS Triangle (Cleared Hepatocystic Triangle) -->
  <polygon points="180,140 160,200 230,180" fill="rgba(0, 163, 224, 0.2)" stroke="#00A3E0" stroke-width="2" stroke-dasharray="4 4" />
  <text x="120" y="165" fill="#38BDF8" font-size="10" font-family="sans-serif" font-weight="bold">Triángulo de Calot</text>
  <text x="120" y="178" fill="#7DD3FC" font-size="8" font-family="sans-serif">(Despejado de grasa)</text>

  <!-- 2 Critical Structures Visible -->
  <!-- Cystic Artery -->
  <path d="M175 145 L200 160" stroke="#EF4444" stroke-width="3" stroke-linecap="round" />
  <text x="205" y="155" fill="#F87171" font-size="9" font-family="sans-serif">1. Arteria Cística</text>

  <!-- Cystic Duct -->
  <path d="M165 190 L210 185" stroke="#10B981" stroke-width="4" stroke-linecap="round" />
  <text x="170" y="210" fill="#34D399" font-size="9" font-family="sans-serif">2. Conducto Cístico</text>

  <!-- Common Bile Duct (Colédoco) -->
  <path d="M150 140 L160 270" stroke="#059669" stroke-width="5" stroke-linecap="round" />
  <text x="90" y="250" fill="#6EE7B7" font-size="10" font-family="sans-serif">Vía Biliar Principal</text>

  <!-- Security Protocol Badge -->
  <rect x="25" y="240" width="350" height="60" rx="10" fill="#0B1426" stroke="#00A3E0" stroke-width="1.5" />
  <text x="40" y="262" fill="#00A3E0" font-size="12" font-family="sans-serif" font-weight="bold">PROTOCOLO DE SEGURIDAD STRASBERG (CVS)</text>
  <text x="40" y="278" fill="#F8FAFC" font-size="10" font-family="sans-serif">• Dos estructuras identificadas inequívocamente antes de clipar</text>
  <text x="40" y="292" fill="#94A3B8" font-size="9" font-family="sans-serif">• Técnica estandarizada por el Dr. Perzabal para tasa cero de lesión de vía biliar</text>
</svg>