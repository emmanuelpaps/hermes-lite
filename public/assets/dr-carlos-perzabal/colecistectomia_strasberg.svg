<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="bgColVol" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B14" />
      <stop offset="50%" stop-color="#0A1224" />
      <stop offset="100%" stop-color="#080F1E" />
    </linearGradient>
    <linearGradient id="liverBedVol" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400E" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#78350F" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#451A03" stop-opacity="0.55" />
    </linearGradient>
    <radialGradient id="gbCleanVol" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.55" />
      <stop offset="40%" stop-color="#10B981" stop-opacity="0.45" />
      <stop offset="80%" stop-color="#059669" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.4" />
    </radialGradient>
    <radialGradient id="calotWindowG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.05" />
    </radialGradient>
    <filter id="glowColVol" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="320" rx="16" fill="url(#bgColVol)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Subtle Surgical Grid Overlay -->
  <g opacity="0.07" stroke="#38BDF8" stroke-width="0.5">
    <line x1="40" y1="0" x2="40" y2="320" />
    <line x1="120" y1="0" x2="120" y2="320" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="280" y1="0" x2="280" y2="320" />
    <line x1="360" y1="0" x2="360" y2="320" />
    <line x1="0" y1="60" x2="400" y2="60" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="180" x2="400" y2="180" />
    <line x1="0" y1="240" x2="400" y2="240" />
  </g>

  <!-- Liver Inferior Border / Lecho Hepático Disecado -->
  <path d="M30 65 Q180 32 370 75 L370 115 Q200 80 30 115 Z" fill="url(#liverBedVol)" stroke="#B45309" stroke-width="1.5" />
  <!-- Exposed Lower Third of Liver Bed (Fondo del Lecho Hepático Despejado) -->
  <path d="M195 102 C230 92 280 105 305 118" fill="none" stroke="#D97706" stroke-width="2.5" stroke-dasharray="4 2" />
  <text x="310" y="68" fill="#D97706" font-size="9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="700">LECHO HEPÁTICO DESPEJADO</text>

  <!-- Retracted Gallbladder (Vesícula Traccionada Cefálicamente) -->
  <path d="M225 96 C275 92 305 130 292 170 C280 200 248 202 232 172 C222 144 204 122 175 134 Z" fill="url(#gbCleanVol)" stroke="#10B981" stroke-width="2.5" filter="url(#glowColVol)" />
  <path d="M236 106 C264 105 284 132 278 160" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.45" stroke-linecap="round" />
  <text x="302" y="152" fill="#34D399" font-size="10" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="700">Vesícula Biliar</text>

  <!-- Strasberg CVS Cleared Triangle (Ventana Hepatocística Transiluminada) -->
  <polygon points="175,134 152,196 232,172" fill="url(#calotWindowG)" stroke="#00A3E0" stroke-width="2" stroke-dasharray="4 3" filter="url(#glowColVol)" />
  
  <!-- Calot Window Label -->
  <g transform="translate(100, 150)">
    <rect x="-8" y="-12" width="102" height="28" rx="4" fill="#041E2E" fill-opacity="0.9" stroke="#00A3E0" stroke-width="0.8" />
    <text x="43" y="1" fill="#38BDF8" font-size="7.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="800" text-anchor="middle">TRIÁNGULO DE CALOT</text>
    <text x="43" y="11" fill="#7DD3FC" font-size="7" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" text-anchor="middle">100% Despejado de Grasa</text>
  </g>

  <!-- Structure 1: Cystic Artery (Arteria Cística con Clips de Titanio) -->
  <path d="M168 140 L198 154" stroke="#EF4444" stroke-width="3.5" stroke-linecap="round" filter="url(#glowColVol)" />
  <!-- Double Titanium Clips on Artery -->
  <rect x="176" y="140" width="3" height="8" rx="1" fill="#FEF3C7" stroke="#D97706" stroke-width="0.8" transform="rotate(-25 176 140)" />
  <rect x="186" y="145" width="3" height="8" rx="1" fill="#FEF3C7" stroke="#D97706" stroke-width="0.8" transform="rotate(-25 186 145)" />

  <g transform="translate(204, 142)">
    <line x1="0" y1="0" x2="16" y2="0" stroke="#EF4444" stroke-width="1.2" />
    <circle cx="0" cy="0" r="2" fill="#EF4444" />
    <rect x="18" y="-10" width="94" height="22" rx="4" fill="#1C090D" fill-opacity="0.9" stroke="#EF4444" stroke-width="0.8" />
    <text x="65" y="1" fill="#FCA5A5" font-size="7.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="800" text-anchor="middle">1. ARTERIA CÍSTICA</text>
    <text x="65" y="9" fill="#F87171" font-size="6.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" text-anchor="middle">Clips Titanio Dobles</text>
  </g>

  <!-- Structure 2: Cystic Duct (Conducto Cístico con Clips de Titanio) -->
  <path d="M158 188 L206 180" stroke="#10B981" stroke-width="5" stroke-linecap="round" filter="url(#glowColVol)" />
  <!-- Double Titanium Clips on Cystic Duct -->
  <rect x="170" y="180" width="3.5" height="10" rx="1" fill="#FEF3C7" stroke="#D97706" stroke-width="0.8" transform="rotate(10 170 180)" />
  <rect x="182" y="178" width="3.5" height="10" rx="1" fill="#FEF3C7" stroke="#D97706" stroke-width="0.8" transform="rotate(10 182 178)" />

  <g transform="translate(178, 198)">
    <rect x="0" y="0" width="102" height="22" rx="4" fill="#032014" fill-opacity="0.9" stroke="#10B981" stroke-width="0.8" />
    <text x="51" y="11" fill="#34D399" font-size="7.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="800" text-anchor="middle">2. CONDUCTO CÍSTICO</text>
    <text x="51" y="19" fill="#6EE7B7" font-size="6.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" text-anchor="middle">Identificado Inequívoco</text>
  </g>

  <!-- Protected Common Bile Duct (Colédoco / Vía Biliar Principal) -->
  <path d="M145 132 L154 265" stroke="#059669" stroke-width="6" stroke-linecap="round" />
  <path d="M147 132 L156 265" stroke="#34D399" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  <text x="82" y="246" fill="#6EE7B7" font-size="8.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="700">Vía Biliar Principal (Colédoco)</text>
  <text x="82" y="258" fill="#38BDF8" font-size="7.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">Preservada · Cero Tracción</text>

  <!-- Top-Left Tactical Badge -->
  <g transform="translate(16, 16)">
    <rect width="144" height="66" rx="8" fill="#0B132B" fill-opacity="0.95" stroke="#00A3E0" stroke-width="1" />
    <circle cx="12" cy="14" r="3.5" fill="#00A3E0" />
    <text x="20" y="17" fill="#38BDF8" font-size="9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="800" letter-spacing="0.5">STRASBERG CVS (SEGURIDAD)</text>
    <text x="12" y="32" fill="#F8FAFC" font-size="8.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="600">2 Estructuras Identificadas</text>
    <text x="12" y="45" fill="#10B981" font-size="8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">Calot Despejado de Grasa</text>
    <text x="12" y="58" fill="#FDE68A" font-size="7.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">Lecho Hepático Despegado 1/3</text>
  </g>

  <!-- Bottom Technical Protocol Card (Matches exact tests) -->
  <rect x="25" y="265" width="350" height="42" rx="8" fill="#0B1426" stroke="#00A3E0" stroke-width="1.5" />
  <text x="40" y="281" fill="#00A3E0" font-size="10" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="bold">PROTOCOLO DE SEGURIDAD STRASBERG (CVS)</text>
  <text x="40" y="294" fill="#F8FAFC" font-size="8.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">• Dos estructuras identificadas inequívocamente antes de clipar</text>
  <text x="40" y="303" fill="#94A3B8" font-size="7.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">• Técnica estandarizada por el Dr. Perzabal para tasa cero de lesión de vía biliar</text>
</svg>