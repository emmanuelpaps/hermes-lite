<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D18" />
      <stop offset="100%" stop-color="#0B1426" />
    </linearGradient>
    <linearGradient id="sleeveG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A3E0" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>
  <rect width="400" height="320" rx="20" fill="url(#bgG)" stroke="#1E293B" stroke-width="1.5" />
  
  <!-- Esophagus -->
  <path d="M175 30 L175 75 M195 30 L195 75" stroke="#64748B" stroke-width="3" stroke-linecap="round" />
  <text x="185" y="24" fill="#94A3B8" font-size="10" font-family="sans-serif" text-anchor="middle">Esófago</text>

  <!-- Resected Fundus (Ghost / Dotted) -->
  <path d="M195 75 C240 75 320 100 320 165 C320 225 255 250 205 250" fill="rgba(239, 68, 68, 0.08)" stroke="#EF4444" stroke-width="2" stroke-dasharray="6 6" />
  <text x="280" y="150" fill="#F87171" font-size="11" font-family="sans-serif" font-weight="bold">Resección 75-80%</text>
  <text x="280" y="166" fill="#FCA5A5" font-size="9" font-family="sans-serif">(Fondo Gástrico · Grelina)</text>

  <!-- Staple Line -->
  <path d="M195 75 C200 130 195 200 185 250" stroke="#F59E0B" stroke-width="3" stroke-dasharray="3 3" />
  <text x="215" y="200" fill="#FBBF24" font-size="9" font-family="sans-serif">Línea de Grapas</text>

  <!-- Gastric Sleeve (Tubular Remaining) -->
  <path d="M175 75 C160 110 160 190 170 250 L185 250 C195 200 200 130 195 75 Z" fill="url(#sleeveG)" fill-opacity="0.25" stroke="#00A3E0" stroke-width="3" />
  
  <!-- Duodenum / Pylorus -->
  <path d="M170 250 L140 270 M185 250 L155 285" stroke="#64748B" stroke-width="3" />
  <text x="125" y="295" fill="#94A3B8" font-size="10" font-family="sans-serif">Píloro / Duodeno</text>

  <!-- Sleeve Badge & Metrics -->
  <rect x="20" y="30" width="130" height="60" rx="10" fill="#0B1426" stroke="#00A3E0" stroke-width="1" />
  <text x="30" y="50" fill="#38BDF8" font-size="11" font-family="sans-serif" font-weight="bold">MANGA GÁSTRICA</text>
  <text x="30" y="65" fill="#F8FAFC" font-size="10" font-family="sans-serif">Volumen: 120-150 ml</text>
  <text x="30" y="80" fill="#D4AF37" font-size="9" font-family="sans-serif">Sonda calibración 36 Fr</text>

  <rect x="235" y="245" width="145" height="55" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <text x="245" y="265" fill="#10B981" font-size="10" font-family="sans-serif" font-weight="bold">✓ ASMBS/IFSO 2022</text>
  <text x="245" y="280" fill="#94A3B8" font-size="9" font-family="sans-serif">Estancia: 24 - 48 hrs</text>
  <text x="245" y="293" fill="#94A3B8" font-size="9" font-family="sans-serif">Retorno laboral: 7 días</text>
</svg>