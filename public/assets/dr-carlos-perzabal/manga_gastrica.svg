<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="bgManga" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B14" />
      <stop offset="50%" stop-color="#0A1224" />
      <stop offset="100%" stop-color="#080F1E" />
    </linearGradient>
    <linearGradient id="sleeveVolumetric" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369A1" />
      <stop offset="25%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="75%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <radialGradient id="resectionGlow" cx="60%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#DC2626" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#991B1B" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="stapleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="bougieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glowVol" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="320" rx="16" fill="url(#bgManga)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Subtle Surgical Grid Overlay -->
  <g opacity="0.07" stroke="#38BDF8" stroke-width="0.5">
    <line x1="40" y1="0" x2="40" y2="320" />
    <line x1="120" y1="0" x2="120" y2="320" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="280" y1="0" x2="280" y2="320" />
    <line x1="360" y1="0" x2="360" y2="320" />
    <line x1="0" y1="60" x2="400" y2="60" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="180" x2="400" y2="180" />
    <line x1="0" y1="240" x2="400" y2="240" />
  </g>

  <!-- Esophagus -->
  <path d="M172 26 L172 72 M196 26 L196 72" stroke="#64748B" stroke-width="3.5" stroke-linecap="round" />
  <path d="M172 45 L196 45 M172 58 L196 58" stroke="#475569" stroke-width="1" stroke-dasharray="2 2" />
  <text x="184" y="22" fill="#94A3B8" font-size="9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="600" text-anchor="middle">ESÓFAGO</text>

  <!-- Resected Fundus Ghost (Volumetric Shadow of Excised Stomach 75-80%) -->
  <path d="M196 72 C240 54 285 70 310 110 C324 135 316 175 285 205 C256 230 220 244 202 248" fill="url(#resectionGlow)" stroke="#EF4444" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.8" />
  
  <!-- Resection Dimension Lines & Text -->
  <g transform="translate(252, 132)">
    <rect x="-10" y="-14" width="128" height="34" rx="6" fill="#180B0F" fill-opacity="0.85" stroke="#EF4444" stroke-width="1" />
    <text x="54" y="0" fill="#FCA5A5" font-size="8.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="800" text-anchor="middle">RESECCIÓN 75 - 80%</text>
    <text x="54" y="12" fill="#F87171" font-size="7.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" text-anchor="middle">Fondo Gástrico · Cese Grelina</text>
  </g>

  <!-- Internal 36 Fr Calibration Bougie (Visual Core) -->
  <path d="M184 62 C178 105 178 175 186 248" fill="none" stroke="url(#bougieGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="8 3" opacity="0.4" />

  <!-- Volumetric Tubular Gastric Sleeve (Residual Volume 120 - 150 ml) -->
  <path d="M172 72 C162 105 160 175 168 248 L196 248 C202 175 204 105 196 72 Z" fill="url(#sleeveVolumetric)" stroke="#38BDF8" stroke-width="2.5" filter="url(#glowVol)" />

  <!-- Sleeve Specular Highlight (Cylindrical 3D Depth) -->
  <path d="M178 78 C172 108 171 170 176 242" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.45" stroke-linecap="round" />

  <!-- Continuous Mechanical Staple Line (Titanium Staples 60 mm) -->
  <path d="M196 72 C204 105 202 175 196 248" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="4 2" />
  <!-- Individual Surgical Staple Markers -->
  <g stroke="#FDE68A" stroke-width="1.6" stroke-linecap="round">
    <line x1="194" y1="80" x2="199" y2="80" />
    <line x1="195" y1="95" x2="200" y2="95" />
    <line x1="196" y1="110" x2="201" y2="110" />
    <line x1="197" y1="125" x2="202" y2="125" />
    <line x1="198" y1="140" x2="203" y2="140" />
    <line x1="198" y1="155" x2="203" y2="155" />
    <line x1="198" y1="170" x2="203" y2="170" />
    <line x1="197" y1="185" x2="202" y2="185" />
    <line x1="197" y1="200" x2="202" y2="200" />
    <line x1="196" y1="215" x2="201" y2="215" />
    <line x1="196" y1="230" x2="201" y2="230" />
    <line x1="195" y1="244" x2="200" y2="244" />
  </g>

  <!-- Staple Line Annotation -->
  <g transform="translate(204, 185)">
    <line x1="0" y1="0" x2="18" y2="0" stroke="#F59E0B" stroke-width="1.2" />
    <circle cx="18" cy="0" r="2" fill="#F59E0B" />
    <rect x="22" y="-12" width="94" height="24" rx="4" fill="#181308" fill-opacity="0.9" stroke="#D97706" stroke-width="0.8" />
    <text x="28" y="0" fill="#FDE68A" font-size="7.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="700">LÍNEA DE GRAPAS</text>
    <text x="28" y="9" fill="#F59E0B" font-size="7" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">Cartuchos Titanio 60 mm</text>
  </g>

  <!-- Pylorus & Preserved Duodenum -->
  <path d="M168 248 C160 262 145 272 128 274 C112 276 96 268 90 254" fill="none" stroke="#0284C7" stroke-width="3" stroke-linecap="round" />
  <circle cx="168" cy="248" r="3.5" fill="#38BDF8" stroke="#0C4A6E" stroke-width="1.5" />
  <text x="120" y="292" fill="#38BDF8" font-size="8.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="600" text-anchor="middle">Píloro Preservado (Antro Íntegro)</text>

  <!-- Top-Left Tactical Badge -->
  <g transform="translate(16, 16)">
    <rect width="144" height="66" rx="8" fill="#0B132B" fill-opacity="0.95" stroke="#00A3E0" stroke-width="1" />
    <circle cx="12" cy="14" r="3.5" fill="#00A3E0" />
    <text x="20" y="17" fill="#38BDF8" font-size="9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="800" letter-spacing="0.5">MANGA GÁSTRICA (LSG)</text>
    <text x="12" y="32" fill="#F8FAFC" font-size="8.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="600">Volumen: 120 - 150 ml</text>
    <text x="12" y="45" fill="#D4AF37" font-size="8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">Sonda calibración: 36 Fr (12 mm)</text>
    <text x="12" y="58" fill="#10B981" font-size="7.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">-85% Capacidad Gástrica</text>
  </g>

  <!-- Bottom-Right Clinical Outcome Card -->
  <g transform="translate(224, 250)">
    <rect width="160" height="54" rx="8" fill="#0B132B" fill-opacity="0.95" stroke="#334155" stroke-width="1" />
    <text x="12" y="16" fill="#10B981" font-size="8.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="800">✓ ASMBS / IFSO 2022</text>
    <text x="12" y="30" fill="#E2E8F0" font-size="8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">Estancia: 24 - 48 hrs en suite</text>
    <text x="12" y="43" fill="#94A3B8" font-size="7.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">Retorno laboral: 7 - 10 días</text>
  </g>
</svg>