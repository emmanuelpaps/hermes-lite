<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="bgBypassPre" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B14" />
      <stop offset="50%" stop-color="#0A1224" />
      <stop offset="100%" stop-color="#080F1E" />
    </linearGradient>
    <radialGradient id="stomachFullGlow" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.18" />
      <stop offset="85%" stop-color="#B45309" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#78350F" stop-opacity="0.3" />
    </radialGradient>
    <linearGradient id="esoGradBy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="duoGradBy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="flowArrowG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="softGlowBypassPre" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="320" rx="16" fill="url(#bgBypassPre)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Subtle Surgical Grid Overlay -->
  <g opacity="0.07" stroke="#38BDF8" stroke-width="0.5">
    <line x1="40" y1="0" x2="40" y2="320" />
    <line x1="120" y1="0" x2="120" y2="320" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="280" y1="0" x2="280" y2="320" />
    <line x1="360" y1="0" x2="360" y2="320" />
    <line x1="0" y1="60" x2="400" y2="60" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="180" x2="400" y2="180" />
    <line x1="0" y1="240" x2="400" y2="240" />
  </g>

  <!-- Esophagus -->
  <path d="M152 24 L152 68 M176 24 L176 68" stroke="url(#esoGradBy)" stroke-width="3.5" stroke-linecap="round" />
  <path d="M152 42 L176 42 M152 54 L176 54" stroke="#64748B" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />
  <text x="164" y="20" fill="#94A3B8" font-size="9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="600" text-anchor="middle">ESÓFAGO</text>

  <!-- Full Preoperative Stomach Anatomy (1,500 ml) -->
  <path d="M152 68 C135 98 132 165 142 215 C146 230 156 238 170 238 C182 238 190 230 196 218 C208 178 226 150 258 138 C298 122 306 78 270 64 C225 48 186 56 176 68 Z" fill="url(#stomachFullGlow)" stroke="#F59E0B" stroke-width="2.5" filter="url(#softGlowBypassPre)" />

  <!-- Conventional Food Pathway / Digestive Flow Arrows -->
  <path d="M164 68 C160 120 162 170 178 224" fill="none" stroke="url(#flowArrowG)" stroke-width="2" stroke-dasharray="4 3" opacity="0.75" />
  <polygon points="178,228 174,218 183,220" fill="#FBBF24" />

  <!-- Stomach Internal Text & Capacity Callout -->
  <g transform="translate(196, 120)">
    <rect x="-8" y="-12" width="108" height="30" rx="5" fill="#171206" fill-opacity="0.85" stroke="#D97706" stroke-width="1" />
    <text x="46" y="2" fill="#FDE68A" font-size="8.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="700" text-anchor="middle">ESTÓMAGO ÍNTEGRO</text>
    <text x="46" y="12" fill="#F59E0B" font-size="7.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" text-anchor="middle">Capacidad: 1,500 ml</text>
  </g>

  <!-- Pylorus Valve -->
  <circle cx="170" cy="238" r="4.5" fill="#F59E0B" stroke="#FEF3C7" stroke-width="1.5" />
  <text x="145" y="254" fill="#FBBF24" font-size="8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="600">Píloro</text>

  <!-- Conventional Duodenal C-Loop (Tránsito Duodenal Completo) -->
  <path d="M170 238 C158 248 136 256 118 256 C96 256 78 244 78 218 C78 190 98 178 120 178 C128 178 134 182 138 188" fill="none" stroke="url(#duoGradBy)" stroke-width="4.5" stroke-linecap="round" />
  <text x="74" y="274" fill="#34D399" font-size="8.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="600">Arco Duodenal en "C"</text>
  <text x="74" y="286" fill="#6EE7B7" font-size="7.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">Absorción Proximal Ordinaria</text>

  <!-- Bile & Pancreatic Secretions Inflow into Duodenum (Ampolla de Vater) -->
  <path d="M102 145 C102 165 106 178 106 195" fill="none" stroke="#10B981" stroke-width="2.5" stroke-dasharray="3 2" />
  <circle cx="106" cy="195" r="3" fill="#10B981" stroke="#FFFFFF" stroke-width="1" />
  <text x="114" y="160" fill="#6EE7B7" font-size="7" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">Bilis y Jugos Pancreáticos</text>

  <!-- Jejunum Continuation -->
  <path d="M138 188 C144 196 152 205 160 215 C170 226 178 240 188 260 C194 274 204 286 218 296" fill="none" stroke="#0284C7" stroke-width="4" stroke-linecap="round" />
  <text x="232" y="298" fill="#38BDF8" font-size="8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="600">Yeyuno Proximal</text>

  <!-- Top-Left Tactical Badge -->
  <g transform="translate(16, 16)">
    <rect width="144" height="64" rx="8" fill="#0B132B" fill-opacity="0.95" stroke="#F59E0B" stroke-width="1" />
    <circle cx="12" cy="14" r="3.5" fill="#F59E0B" />
    <text x="20" y="17" fill="#FDE68A" font-size="9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="800" letter-spacing="0.5">ANATOMÍA DIGESTIVA PREVIA</text>
    <text x="12" y="31" fill="#F8FAFC" font-size="8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">Capacidad Estomacal: 1,500 ml</text>
    <text x="12" y="44" fill="#D4AF37" font-size="7.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">Tránsito Duodenal Convencional</text>
    <text x="12" y="56" fill="#94A3B8" font-size="7.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">Sin exclusión ni derivación en Y</text>
  </g>

  <!-- Bottom-Right Clinical Preoperative Card -->
  <g transform="translate(232, 238)">
    <rect width="152" height="66" rx="8" fill="#0B132B" fill-opacity="0.95" stroke="#334155" stroke-width="1" />
    <text x="12" y="16" fill="#FBBF24" font-size="8.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="700">FISIOLOGÍA BASAL</text>
    <text x="12" y="30" fill="#E2E8F0" font-size="8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">• Quimo transita por todo el duodeno</text>
    <text x="12" y="43" fill="#94A3B8" font-size="7.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">• Sin estímulo precoz de GLP-1</text>
    <text x="12" y="56" fill="#94A3B8" font-size="7.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">• Reserva metabólica no alterada</text>
  </g>
</svg>
