<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="bgColPre" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B14" />
      <stop offset="50%" stop-color="#0A1224" />
      <stop offset="100%" stop-color="#080F1E" />
    </linearGradient>
    <linearGradient id="liverBedPre" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400E" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#78350F" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#451A03" stop-opacity="0.5" />
    </linearGradient>
    <radialGradient id="gbInflamed" cx="60%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#047857" stop-opacity="0.35" />
      <stop offset="75%" stop-color="#064E3B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.3" />
    </radialGradient>
    <radialGradient id="fatPadGrad" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.75" />
      <stop offset="45%" stop-color="#F59E0B" stop-opacity="0.6" />
      <stop offset="85%" stop-color="#D97706" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#92400E" stop-opacity="0.3" />
    </radialGradient>
    <radialGradient id="stoneG1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </radialGradient>
    <filter id="softGlowColPre" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="320" rx="16" fill="url(#bgColPre)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Subtle Surgical Grid Overlay -->
  <g opacity="0.07" stroke="#38BDF8" stroke-width="0.5">
    <line x1="40" y1="0" x2="40" y2="320" />
    <line x1="120" y1="0" x2="120" y2="320" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="280" y1="0" x2="280" y2="320" />
    <line x1="360" y1="0" x2="360" y2="320" />
    <line x1="0" y1="60" x2="400" y2="60" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="180" x2="400" y2="180" />
    <line x1="0" y1="240" x2="400" y2="240" />
  </g>

  <!-- Liver Inferior Border / Lecho Hepático (Lóbulo Derecho) -->
  <path d="M30 65 Q180 32 370 75 L370 115 Q200 80 30 115 Z" fill="url(#liverBedPre)" stroke="#B45309" stroke-width="1.5" />
  <text x="310" y="70" fill="#D97706" font-size="9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="700">LECHO HEPÁTICO</text>

  <!-- Distended Pathological Gallbladder (Pared Engrosada por Inflamación) -->
  <!-- Outer Edematous Inflammatory Border (Pared 4-6 mm) -->
  <path d="M208 92 C265 88 305 130 292 178 C280 216 238 218 220 185 C208 152 190 128 162 138" fill="none" stroke="#EF4444" stroke-width="6" stroke-linecap="round" opacity="0.35" />
  <!-- Gallbladder Body with Radial Volumetric Gradient -->
  <path d="M210 94 C262 90 298 132 288 175 C278 210 240 212 222 182 C210 150 192 126 165 136 Z" fill="url(#gbInflamed)" stroke="#10B981" stroke-width="2.5" filter="url(#softGlowColPre)" />

  <!-- Multiple Gallstones (Cálculos / Litiasis Múltiple Facetada) -->
  <g filter="url(#softGlowColPre)">
    <!-- Calculus 1 (Fundus) -->
    <polygon points="252,145 264,140 270,152 260,160 250,154" fill="url(#stoneG1)" stroke="#FEF3C7" stroke-width="1" />
    <!-- Calculus 2 -->
    <polygon points="236,162 248,158 252,170 242,176 234,170" fill="url(#stoneG1)" stroke="#FEF3C7" stroke-width="1" />
    <!-- Calculus 3 -->
    <polygon points="262,168 274,165 276,176 268,182 260,176" fill="url(#stoneG1)" stroke="#FEF3C7" stroke-width="1" />
    <!-- Calculus 4 (Infundibulum) -->
    <circle cx="230" cy="148" r="6" fill="url(#stoneG1)" stroke="#FEF3C7" stroke-width="1" />
    <!-- Calculus 5 (Impacted at Neck) -->
    <polygon points="208,138 216,134 220,142 214,148 206,144" fill="url(#stoneG1)" stroke="#FEF3C7" stroke-width="1" />
  </g>

  <!-- Gallstones Label -->
  <g transform="translate(278, 142)">
    <line x1="0" y1="0" x2="24" y2="0" stroke="#FBBF24" stroke-width="1.2" />
    <circle cx="0" cy="0" r="2" fill="#FBBF24" />
    <rect x="26" y="-14" width="86" height="30" rx="4" fill="#181105" fill-opacity="0.9" stroke="#D97706" stroke-width="0.8" />
    <text x="69" y="-2" fill="#FEF3C7" font-size="7.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="800" text-anchor="middle">LITIASIS ACTIVA</text>
    <text x="69" y="9" fill="#F59E0B" font-size="7" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" text-anchor="middle">Cálculos 5 - 15 mm</text>
  </g>

  <!-- Occluded Calot Triangle Area (Covered by Dense Inflammatory Adipose Tissue) -->
  <g transform="translate(142, 134)">
    <!-- Dense Fat Blobs hiding the triangle -->
    <ellipse cx="28" cy="24" rx="34" ry="22" fill="url(#fatPadGrad)" filter="url(#softGlowColPre)" />
    <ellipse cx="44" cy="14" rx="22" ry="16" fill="url(#fatPadGrad)" />
    <ellipse cx="14" cy="32" rx="20" ry="15" fill="url(#fatPadGrad)" />
    <!-- Adhesion Strands -->
    <path d="M6 12 Q24 26 42 18 M12 36 Q32 28 52 34" stroke="#FDE68A" stroke-width="1.2" stroke-dasharray="3 2" fill="none" opacity="0.7" />
    <!-- Occluded Warning Box -->
    <rect x="-10" y="38" width="102" height="26" rx="4" fill="#1E1308" fill-opacity="0.95" stroke="#F59E0B" stroke-width="1" />
    <text x="41" y="50" fill="#FDE68A" font-size="7.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="800" text-anchor="middle">CALOT OCLUIDO</text>
    <text x="41" y="59" fill="#F87171" font-size="6.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" text-anchor="middle">Grasa y Adherencias Densas</text>
  </g>

  <!-- Concealed / At Risk Bile Duct (Ducto Colédoco en Riesgo) -->
  <path d="M142 140 L152 268" stroke="#059669" stroke-width="5" stroke-linecap="round" opacity="0.35" stroke-dasharray="6 4" />
  <g transform="translate(68, 230)">
    <rect width="86" height="24" rx="4" fill="#021E14" fill-opacity="0.9" stroke="#EF4444" stroke-width="0.8" />
    <text x="43" y="11" fill="#FCA5A5" font-size="7" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="700" text-anchor="middle">VÍA BILIAR OCULTA</text>
    <text x="43" y="20" fill="#F87171" font-size="6.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" text-anchor="middle">Riesgo Quirúrgico</text>
  </g>

  <!-- Top-Left Tactical Badge -->
  <g transform="translate(16, 16)">
    <rect width="144" height="64" rx="8" fill="#0B132B" fill-opacity="0.95" stroke="#EF4444" stroke-width="1" />
    <circle cx="12" cy="14" r="3.5" fill="#EF4444" />
    <text x="20" y="17" fill="#FCA5A5" font-size="8.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="800" letter-spacing="0.5">CUADRO INFLAMATORIO</text>
    <text x="12" y="31" fill="#F8FAFC" font-size="8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">Litiasis Vesicular Sintomática</text>
    <text x="12" y="44" fill="#FBBF24" font-size="7.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">Triángulo Calot Ocluido por Grasa</text>
    <text x="12" y="56" fill="#F87171" font-size="7.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">Pared Engrosada por Edema</text>
  </g>

  <!-- Bottom-Right Clinical Outcome Card -->
  <g transform="translate(230, 246)">
    <rect width="154" height="58" rx="8" fill="#0B132B" fill-opacity="0.95" stroke="#334155" stroke-width="1" />
    <text x="12" y="15" fill="#FBBF24" font-size="8.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="700">INDICACIÓN QUIRÚRGICA</text>
    <text x="12" y="29" fill="#E2E8F0" font-size="8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">• Riesgo de pancreatitis biliar</text>
    <text x="12" y="42" fill="#E2E8F0" font-size="8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">• Cólicos recurrentes y colecistitis</text>
    <text x="12" y="53" fill="#94A3B8" font-size="7.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">Consenso SAGES / WSES 2022</text>
  </g>
</svg>
