<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="bgByVol" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B14" />
      <stop offset="50%" stop-color="#0A1224" />
      <stop offset="100%" stop-color="#080F1E" />
    </linearGradient>
    <radialGradient id="pouchVolG" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </radialGradient>
    <linearGradient id="alimentaryVolG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#0284C7" />
      <stop offset="80%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#0C4A6E" />
    </linearGradient>
    <linearGradient id="biliopancreaticVolG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>
    <linearGradient id="remnantGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.15" />
    </linearGradient>
    <filter id="glowByVol" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="320" rx="16" fill="url(#bgByVol)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Subtle Surgical Grid Overlay -->
  <g opacity="0.07" stroke="#38BDF8" stroke-width="0.5">
    <line x1="40" y1="0" x2="40" y2="320" />
    <line x1="120" y1="0" x2="120" y2="320" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="280" y1="0" x2="280" y2="320" />
    <line x1="360" y1="0" x2="360" y2="320" />
    <line x1="0" y1="60" x2="400" y2="60" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="180" x2="400" y2="180" />
    <line x1="0" y1="240" x2="400" y2="240" />
  </g>

  <!-- Esophagus -->
  <path d="M148 24 L148 56 M172 24 L172 56" stroke="#64748B" stroke-width="3.5" stroke-linecap="round" />
  <path d="M148 40 L172 40" stroke="#475569" stroke-width="1" stroke-dasharray="2 2" />
  <text x="160" y="20" fill="#94A3B8" font-size="9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="600" text-anchor="middle">ESÓFAGO</text>

  <!-- Remnant Excluded Stomach (Estómago Excluido en Cavidad) -->
  <path d="M178 72 C215 56 270 75 285 118 C295 146 278 185 245 204 C212 222 182 220 178 195 C176 150 176 100 178 72 Z" fill="url(#remnantGlow)" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4" />
  <!-- Excluded Duodenum -->
  <path d="M178 195 C174 212 165 224 150 228 C136 230 125 224 125 210 C125 190 145 180 162 180" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="4 3" />
  <g transform="translate(208, 134)">
    <rect x="0" y="0" width="102" height="26" rx="4" fill="#0B132B" fill-opacity="0.85" stroke="#475569" stroke-width="0.8" />
    <text x="51" y="12" fill="#CBD5E1" font-size="8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="700" text-anchor="middle">ESTÓMAGO EXCLUIDO</text>
    <text x="51" y="21" fill="#94A3B8" font-size="7" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" text-anchor="middle">Preservado in situ</text>
  </g>

  <!-- Volumetric Gastric Pouch (20 - 30 ml Restrictive Pouch) -->
  <path d="M148 56 C140 76 142 96 152 108 L174 108 C182 96 180 76 172 56 Z" fill="url(#pouchVolG)" stroke="#F59E0B" stroke-width="2.5" filter="url(#glowByVol)" />
  <ellipse cx="160" cy="72" rx="6" ry="12" fill="#FFFFFF" fill-opacity="0.3" />

  <!-- Pouch Annotation Callout -->
  <g transform="translate(64, 82)">
    <line x1="78" y1="12" x2="35" y2="12" stroke="#F59E0B" stroke-width="1.2" />
    <circle cx="78" cy="12" r="2" fill="#F59E0B" />
    <rect x="-42" y="0" width="74" height="24" rx="4" fill="#181308" fill-opacity="0.9" stroke="#D97706" stroke-width="0.8" />
    <text x="-5" y="11" fill="#FDE68A" font-size="8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="800" text-anchor="middle">POUCH 20-30 ml</text>
    <text x="-5" y="20" fill="#F59E0B" font-size="7" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" text-anchor="middle">Restrictivo Puro</text>
  </g>

  <!-- Gastrojejunal Anastomosis (Gastroenteroanastomosis 12 mm) -->
  <ellipse cx="163" cy="108" rx="8" ry="3.5" fill="#D97706" stroke="#FEF3C7" stroke-width="1.2" />

  <!-- Alimentary Limb (Asa Alimentaria Roux 100 - 150 cm) -->
  <path d="M163 108 C163 148 132 175 132 215 C132 250 162 268 184 286" fill="none" stroke="url(#alimentaryVolG)" stroke-width="6.5" stroke-linecap="round" filter="url(#glowByVol)" />
  <!-- Specular inner tube highlight -->
  <path d="M163 112 C162 148 134 175 134 215 C134 248 162 266 182 284" fill="none" stroke="#BAE6FD" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- Alimentary Limb Label -->
  <g transform="translate(34, 182)">
    <rect width="90" height="30" rx="5" fill="#032030" fill-opacity="0.9" stroke="#0284C7" stroke-width="0.8" />
    <text x="45" y="13" fill="#38BDF8" font-size="8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="800" text-anchor="middle">ASA ALIMENTARIA</text>
    <text x="45" y="24" fill="#BAE6FD" font-size="7.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" text-anchor="middle">100 - 150 cm</text>
  </g>

  <!-- Biliopancreatic Limb (Asa Biliopancreática 50 - 70 cm) -->
  <path d="M162 180 C182 180 205 195 205 225 C205 252 196 270 184 286" fill="none" stroke="url(#biliopancreaticVolG)" stroke-width="5" stroke-linecap="round" stroke-dasharray="6 2.5" />
  <g transform="translate(214, 218)">
    <rect width="96" height="28" rx="4" fill="#022416" fill-opacity="0.9" stroke="#10B981" stroke-width="0.8" />
    <text x="48" y="12" fill="#34D399" font-size="7.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="700" text-anchor="middle">ASA BILIOPANCREÁTICA</text>
    <text x="48" y="22" fill="#6EE7B7" font-size="7" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" text-anchor="middle">50 - 70 cm (Enzimas/Bilis)</text>
  </g>

  <!-- Jejunojejunostomy (Anastomosis en "Y" de Roux) -->
  <circle cx="184" cy="286" r="7" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2" filter="url(#glowByVol)" />
  <circle cx="184" cy="286" r="3" fill="#0B132B" />
  <!-- Common Channel continuation -->
  <path d="M184 286 C188 296 195 306 205 314" fill="none" stroke="#0284C7" stroke-width="6" stroke-linecap="round" />
  <text x="220" y="302" fill="#FBBF24" font-size="9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="800">Anastomosis en "Y"</text>

  <!-- GLP-1 Incretin Activation Sparkles -->
  <g transform="translate(180, 260)" opacity="0.85">
    <circle cx="0" cy="0" r="2" fill="#FDE68A" />
    <circle cx="10" cy="-6" r="1.5" fill="#38BDF8" />
    <circle cx="-8" cy="-8" r="1.5" fill="#34D399" />
  </g>

  <!-- Top-Left Tactical Badge -->
  <g transform="translate(16, 16)">
    <rect width="144" height="66" rx="8" fill="#0B132B" fill-opacity="0.95" stroke="#D4AF37" stroke-width="1" />
    <circle cx="12" cy="14" r="3.5" fill="#D4AF37" />
    <text x="20" y="17" fill="#FEF3C7" font-size="9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="800" letter-spacing="0.5">BYPASS GÁSTRICO (LRYGB)</text>
    <text x="12" y="32" fill="#F8FAFC" font-size="8.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="600">Pouch Gástrico: 20 - 30 ml</text>
    <text x="12" y="45" fill="#38BDF8" font-size="8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">Asa Alimentaria: 100 - 150 cm</text>
    <text x="12" y="58" fill="#10B981" font-size="7.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">Estimulación Incretinas (GLP-1)</text>
  </g>

  <!-- Top-Right Clinical Outcomes Card -->
  <g transform="translate(236, 16)">
    <rect width="148" height="66" rx="8" fill="#0B132B" fill-opacity="0.95" stroke="#334155" stroke-width="1" />
    <text x="12" y="16" fill="#10B981" font-size="8.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="800">✓ GOLD STANDARD</text>
    <text x="12" y="31" fill="#FEF3C7" font-size="8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">Remisión DM2: &gt;80%</text>
    <text x="12" y="44" fill="#38BDF8" font-size="8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">Control ERGE: &gt;95%</text>
    <text x="12" y="57" fill="#94A3B8" font-size="7.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">Consenso ASMBS / IFSO</text>
  </g>
</svg>