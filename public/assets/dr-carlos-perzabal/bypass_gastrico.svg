<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="bgBy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D18" />
      <stop offset="100%" stop-color="#0B1426" />
    </linearGradient>
    <linearGradient id="pouchG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
  <rect width="400" height="320" rx="20" fill="url(#bgBy)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Esophagus -->
  <path d="M150 25 L150 55 M170 25 L170 55" stroke="#64748B" stroke-width="3" stroke-linecap="round" />

  <!-- Gastric Pouch (15-30 ml) -->
  <path d="M150 55 C145 75 145 95 155 105 L175 105 C185 95 180 75 170 55 Z" fill="url(#pouchG)" fill-opacity="0.35" stroke="#D4AF37" stroke-width="2.5" />
  <text x="100" y="85" fill="#D4AF37" font-size="10" font-family="sans-serif" font-weight="bold">Pouch 20 ml</text>

  <!-- Remnant Excluded Stomach -->
  <path d="M185 70 C220 70 280 90 280 145 C280 200 230 220 190 220 C185 170 185 120 185 70" fill="rgba(100, 116, 139, 0.15)" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="220" y="145" fill="#94A3B8" font-size="10" font-family="sans-serif">Estómago Excluido</text>

  <!-- Roux Alimentary Limb (Asa Alimentaria) -->
  <path d="M165 105 C165 150 140 180 140 230 C140 260 170 280 185 295" fill="none" stroke="#00A3E0" stroke-width="4" stroke-linecap="round" />
  <text x="70" y="195" fill="#38BDF8" font-size="10" font-family="sans-serif" font-weight="bold">Asa Alimentaria</text>
  <text x="70" y="210" fill="#94A3B8" font-size="9" font-family="sans-serif">(100 - 150 cm)</text>

  <!-- Biliopancreatic Limb (Asa Biliopancreática) -->
  <path d="M190 220 C190 240 200 260 185 295" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 2" />
  <text x="210" y="260" fill="#34D399" font-size="9" font-family="sans-serif">Asa Biliar</text>

  <!-- Y Anastomosis -->
  <circle cx="185" cy="295" r="6" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.5" />
  <text x="200" y="300" fill="#FBBF24" font-size="10" font-family="sans-serif" font-weight="bold">Anastomosis en "Y"</text>

  <!-- Clinical Badges -->
  <rect x="235" y="25" width="145" height="65" rx="8" fill="#0B1426" stroke="#D4AF37" stroke-width="1" />
  <text x="245" y="45" fill="#FEF3C7" font-size="11" font-family="sans-serif" font-weight="bold">BYPASS GÁSTRICO</text>
  <text x="245" y="60" fill="#10B981" font-size="9" font-family="sans-serif">✓ Remisión DM2: >80%</text>
  <text x="245" y="75" fill="#38BDF8" font-size="9" font-family="sans-serif">✓ Control ERGE: >95%</text>
</svg>