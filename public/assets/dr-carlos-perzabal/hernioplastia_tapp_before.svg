<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="bgHerniaPre" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B14" />
      <stop offset="50%" stop-color="#0A1224" />
      <stop offset="100%" stop-color="#080F1E" />
    </linearGradient>
    <linearGradient id="musclePreG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991B1B" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#B91C1C" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#7F1D1D" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="fasciaPreG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#92400E" stop-opacity="0.65" />
    </linearGradient>
    <radialGradient id="herniaSacGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F87171" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#EF4444" stop-opacity="0.5" />
      <stop offset="85%" stop-color="#DC2626" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#991B1B" stop-opacity="0.1" />
    </radialGradient>
    <filter id="softGlowHerniaPre" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="320" rx="16" fill="url(#bgHerniaPre)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Subtle Surgical Grid Overlay -->
  <g opacity="0.07" stroke="#38BDF8" stroke-width="0.5">
    <line x1="40" y1="0" x2="40" y2="320" />
    <line x1="120" y1="0" x2="120" y2="320" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="280" y1="0" x2="280" y2="320" />
    <line x1="360" y1="0" x2="360" y2="320" />
    <line x1="0" y1="60" x2="400" y2="60" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="180" x2="400" y2="180" />
    <line x1="0" y1="240" x2="400" y2="240" />
  </g>

  <!-- Abdominal Wall Muscle Layers with Disruption / Tear -->
  <!-- Muscle Layer Left -->
  <path d="M35 62 L150 62 C155 70 158 80 152 92 L35 92 Z" fill="url(#musclePreG)" stroke="#F87171" stroke-width="1" />
  <!-- Muscle Layer Right -->
  <path d="M248 62 L365 62 L365 92 L248 92 C242 80 245 70 248 62 Z" fill="url(#musclePreG)" stroke="#F87171" stroke-width="1" />
  <text x="35" y="52" fill="#F87171" font-size="8.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="600">Pared Muscular (Oblicuo y Transverso)</text>

  <!-- Fascia Transversalis with Central Defect / Gap -->
  <!-- Fascia Left -->
  <path d="M35 98 L142 98 C145 106 142 116 136 122 L35 122 Z" fill="url(#fasciaPreG)" stroke="#FBBF24" stroke-width="1" />
  <!-- Fascia Right -->
  <path d="M258 98 L365 98 L365 122 L258 122 C252 116 248 106 258 98 Z" fill="url(#fasciaPreG)" stroke="#FBBF24" stroke-width="1" />
  <text x="35" y="136" fill="#FBBF24" font-size="8.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="600">Fascia Transversalis</text>

  <!-- Hernia Defect / Brecha Parietal en Orificio Miopectíneo de Fruchaud -->
  <path d="M142 98 Q200 60 258 98" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="4 3" />
  
  <!-- Protruding Hernial Sac (Saco Peritoneal con Protrusión Activa) -->
  <path d="M142 98 C128 145 145 200 200 208 C255 200 272 145 258 98 Z" fill="url(#herniaSacGlow)" stroke="#EF4444" stroke-width="3" filter="url(#softGlowHerniaPre)" />

  <!-- Intra-abdominal Pressure Vectors (Flechas de Presión que empujan el saco) -->
  <g stroke="#F87171" stroke-width="1.8" fill="#F87171" opacity="0.85">
    <line x1="175" y1="110" x2="175" y2="150" />
    <polygon points="175,155 171,146 179,146" />
    <line x1="200" y1="105" x2="200" y2="160" />
    <polygon points="200,165 196,156 204,156" />
    <line x1="225" y1="110" x2="225" y2="150" />
    <polygon points="225,155 221,146 229,146" />
  </g>
  <text x="200" y="86" fill="#FCA5A5" font-size="7.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="700" text-anchor="middle">Presión Intraabdominal</text>

  <!-- Defect Dimension & Warning Badge -->
  <g transform="translate(132, 172)">
    <rect x="-10" y="0" width="156" height="32" rx="5" fill="#1C090D" fill-opacity="0.95" stroke="#EF4444" stroke-width="1" />
    <text x="68" y="13" fill="#FCA5A5" font-size="8.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="800" text-anchor="middle">ORIFICIO DE FRUCHAUD ABIERTO</text>
    <text x="68" y="24" fill="#F87171" font-size="7.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" text-anchor="middle">Protrusión del Saco Peritoneal</text>
  </g>

  <!-- Inferior Epigastric Vessels Landmark (Vasos Epigástricos) -->
  <path d="M128 70 L122 170" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="3 2" />
  <path d="M125 70 L119 170" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3 2" />
  <text x="50" y="162" fill="#94A3B8" font-size="7.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">Vasos Epigástricos Inf.</text>

  <!-- Deep Peritoneal Line (Stretched & Distorted) -->
  <path d="M35 220 Q120 220 142 195 Q200 225 258 195 Q280 220 365 220" stroke="#64748B" stroke-width="1.8" stroke-dasharray="4 4" fill="none" />
  <text x="200" y="240" fill="#94A3B8" font-size="8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" text-anchor="middle">Peritoneo Distendido con Pérdida de Integridad</text>

  <!-- Top-Left Tactical Badge -->
  <g transform="translate(16, 16)">
    <rect width="144" height="64" rx="8" fill="#0B132B" fill-opacity="0.95" stroke="#EF4444" stroke-width="1" />
    <circle cx="12" cy="14" r="3.5" fill="#EF4444" />
    <text x="20" y="17" fill="#FCA5A5" font-size="9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="800" letter-spacing="0.5">DEFECTO HERNIARIO</text>
    <text x="12" y="31" fill="#F8FAFC" font-size="8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">Brecha en Fascia Transversalis</text>
    <text x="12" y="44" fill="#FBBF24" font-size="7.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">Orificio de Fruchaud Abierto</text>
    <text x="12" y="56" fill="#F87171" font-size="7.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">Saco con Riesgo de Atrapamiento</text>
  </g>

  <!-- Bottom-Right Clinical Preoperative Card -->
  <g transform="translate(230, 248)">
    <rect width="154" height="56" rx="8" fill="#0B132B" fill-opacity="0.95" stroke="#334155" stroke-width="1" />
    <text x="12" y="15" fill="#FBBF24" font-size="8.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="700">ESTADO PREOPERATORIO</text>
    <text x="12" y="29" fill="#E2E8F0" font-size="8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">• Tensión muscular anómala</text>
    <text x="12" y="41" fill="#E2E8F0" font-size="8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">• Riesgo de estrangulamiento</text>
    <text x="12" y="51" fill="#94A3B8" font-size="7" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">Guías Europeas EHS 2022</text>
  </g>
</svg>
